idea:
  title: Equational Proofs of Jacobson's Commutativity Theorem when k = 3
  domain: mathematics
  hypothesis: 'It is possible to construct an equational proof of Jacobson''s commutativity
    theorem for rings in which every element x satisfies x^n = x, specifically for
    the case where n is a prime power p^3 and the ring has characteristic p.

    '
  background:
    description: "A classical theorem by Jacobson says that a ring in which every\
      \ element x satisfies the equation x^n = x for some n > 1 is commutative. According\
      \ to Birkhoff\u2019s Completeness Theorem, if n is fixed, there must be an equational\
      \ proof of this theorem. The following paper makes a reduction to the case that\
      \ n is a prime power p^k and the ring has characteristic p and prove the special\
      \ cases k = 1 and k = 2. Try coming up with a proof for the case k = 3.\n"
    papers:
    - url: https://arxiv.org/pdf/2310.05301
      description: '"A classical theorem by Jacobson says that a ring in which every
        element x satisfies the equation x^n = x for some n > 1 is commutative." Andrew
        Ren (2023). arXiv:2310.05301.'
  metadata:
    author: Andrew Ren
