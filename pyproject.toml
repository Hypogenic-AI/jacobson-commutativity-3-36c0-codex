[project]
name = "research-workspace"
version = "0.1.0"
description = "Mathematics research workspace"
requires-python = ">=3.10"
dependencies = [
    "arxiv>=4.0.0",
    "httpx>=0.28.1",
    "pypdf>=6.12.2",
    "requests>=2.33.1",
    "sympy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
